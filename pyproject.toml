[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "jimterpretability"
version = "0.1.0"
description = "Mechanistic interpretability platform: concept discovery, feature steering, and output interception for open-weight LLMs"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3.0",
    "transformer-lens>=1.17.0",
    "sae-lens>=3.23.0",
    "neuronpedia>=0.1.0",
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
